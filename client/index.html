<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Aplica o tema salvo antes de pintar a página (evita "piscar" claro → escuro) -->
    <script>
      try {
        if (localStorage.getItem('nika:theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B0B0B');
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nika Tênis Erechim | Tênis Varejo e Atacado</title>
    <meta
      name="description"
      content="Nika Tênis em Erechim/RS: tênis esportivos e urbanos no varejo e no atacado. Masculino, feminino e infantil. Envio para todo o Brasil."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
